[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "covex-neuron"
version = "0.0.1.dev5"
description = "Run your existing PyTorch / Hugging Face code on AWS Trainium, side by side with NVIDIA GPUs."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
dependencies = ["boto3>=1.34"]

[project.urls]
Homepage = "https://github.com/HolboxAI/covex-neuron"
Repository = "https://github.com/HolboxAI/covex-neuron"
Notebooks = "https://github.com/HolboxAI/covex-neuron/tree/main/notebooks"

[tool.hatch.build.targets.wheel]
packages = ["src/covex_neuron"]
