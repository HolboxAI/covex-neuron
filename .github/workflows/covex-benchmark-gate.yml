name: covex-benchmark-gate

# Blocks PRs into main that change runtime behavior without benchmark evidence.
# See CONTRIBUTING-COVEX.md section 2. Label a PR `no-perf-change` to skip.
on:
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read

jobs:
  benchmark-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check benchmark evidence
        env:
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          HEAD_REF: ${{ github.head_ref }}
          BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ ",$LABELS," == *",no-perf-change,"* || "$HEAD_REF" == "upstream-main" ]]; then
            echo "Exempt (no-perf-change label or upstream sync)."
            exit 0
          fi
          if ! git diff --name-only "$BASE_SHA"...HEAD | grep -q '^benchmarks/results/'; then
            echo "::error::Add the raw before/after results under benchmarks/results/ (see benchmarks/README.md)."
            exit 1
          fi
          printf '%s' "$BODY" > /tmp/body.md
          python3 - <<'PY'
          import re, sys
          body = open("/tmp/body.md").read()
          m = re.search(r"^## Benchmark\s*$(.*?)(?=^## |\Z)", body, re.S | re.M)
          if not m:
              print("::error::The PR description is missing the '## Benchmark' section from the template.")
              sys.exit(1)
          rows = []
          for line in m.group(1).splitlines():
              cells = [c.strip() for c in line.strip().strip("|").split("|")]
              if len(cells) >= 5 and not set("".join(cells)) <= set("-: ") and cells[0].lower() != "metric":
                  if all(cells[:4]):
                      rows.append(cells)
          if not rows:
              print("::error::Fill in at least one row of the benchmark table (metric, concurrency, baseline, this PR, change).")
              sys.exit(1)
          print(f"Benchmark table has {len(rows)} filled row(s).")
          PY
